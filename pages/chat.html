<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Messenger — Academic Coursework Showcase</title>

  <!-- Core Design Tokens & Modular Stylesheets -->
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">

  <!-- Dedicated Chat Page Stylesheet -->
  <link rel="stylesheet" href="../css/pages/chat.css">
</head>
<body class="chat-body">
  <div class="app-shell">
    <!-- Global Header Navigation Mount -->
    <div id="navbarMount"></div>

    <!-- Responsive Messenger Layout -->
    <div class="app-layout app-container chat-app-layout">
      <!-- Left Column: Navigation Sidebar -->
      <aside id="sidebarMount" class="sidebar-left" role="navigation" aria-label="Main Navigation"></aside>

      <!-- Main Chat Messenger Workspace -->
      <main class="main-content chat-main" role="main">
        <div class="card chat-workspace" id="chatWorkspace">
          <!-- Conversations Sidebar Pane -->
          <section class="chat-sidebar" aria-label="Conversations List">
            <div class="chat-sidebar-header">
              <div class="flex items-center justify-between gap-2">
                <h1 class="chat-panel-title">Messenger</h1>
                <span class="badge badge-primary badge-xs" id="chatTotalUnreadBadge">0 Unread</span>
              </div>
              <div class="chat-search-box mt-2">
                <input
                  type="search"
                  id="chatSearchInput"
                  class="form-control form-control-sm"
                  placeholder="Search study chats..."
                  aria-label="Search conversations"
                />
              </div>
              <div class="chat-new-peer-row mt-2">
                <label for="chatNewPeerSelect" class="sr-only">Start new chat with peer</label>
                <select id="chatNewPeerSelect" class="form-control form-control-sm" aria-label="Start conversation with peer">
                  <option value="">+ Start new study chat...</option>
                </select>
              </div>
            </div>

            <div id="conversations-list" class="conversations-list" role="list">
              <!-- Populated dynamically by js/pages/chat.js -->
            </div>
          </section>

          <!-- Active Chat Thread Pane -->
          <section class="chat-thread-pane" aria-label="Active Chat Conversation">
            <header class="chat-thread-header" id="chatActiveHeader">
              <button type="button" class="btn btn-ghost btn-icon-sm show-mobile" id="btnChatBackToList" aria-label="Back to conversations list">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
              </button>
              <div class="chat-active-peer-info" id="chatActivePeerInfo">
                <strong class="font-sm">Select a Conversation</strong>
              </div>
              <div class="chat-header-actions">
                <a href="profile.html" id="btnChatViewProfile" class="btn btn-outline btn-xs">View Profile</a>
              </div>
            </header>

            <div id="chat-message-thread" class="message-thread chat-messages" aria-live="polite">
              <!-- Populated dynamically by js/pages/chat.js -->
            </div>

            <div id="chatTypingIndicator" class="typing-indicator hidden">
              <span class="typing-dot"></span>
              <span class="typing-dot"></span>
              <span class="typing-dot"></span>
              <span class="font-xs text-muted" id="typingPeerLabel">Peer is typing...</span>
            </div>

            <!-- Quick Study Prompts -->
            <div class="chat-quick-prompts" id="chatQuickPrompts">
              <button type="button" class="quick-prompt-chip" data-prompt="Hey! Want to review the CS501 assignment together?">Review Assignment</button>
              <button type="button" class="quick-prompt-chip" data-prompt="Can you share your lab benchmark notes?">Share Lab Notes</button>
              <button type="button" class="quick-prompt-chip" data-prompt="Are you free for a study session at the Science Center?">Study Session</button>
            </div>

            <!-- Message Composer Form -->
            <form id="chatComposerForm" class="chat-composer-form">
              <label for="chat-message-input" class="sr-only">Type a message</label>
              <input
                type="text"
                id="chat-message-input"
                class="form-control chat-input"
                placeholder="Write a message to your study peer..."
                aria-label="Message input"
                autocomplete="off"
                required
              />
              <button type="submit" id="btnSendChatMessage" class="btn btn-primary btn-send-chat" aria-label="Send message">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <line x1="22" y1="2" x2="11" y2="13"></line>
                  <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
                <span>Send</span>
              </button>
            </form>
          </section>
        </div>
      </main>

      <!-- Right Column: Active Peer Academic Info -->
      <aside class="sidebar-right chat-aside" role="complementary" aria-label="Peer Academic Information">
        <div class="card widget-card" id="chatPeerInfoPanel">
          <div class="widget-header">
            <h3 class="widget-title font-sm font-weight-semibold">Peer Study Profile</h3>
          </div>
          <div class="widget-body" id="chatPeerInfoBody">
            <!-- Populated dynamically -->
          </div>
        </div>
      </aside>
    </div>

    <!-- Mobile Bottom Navigation Mount -->
    <div id="mobileNavMount"></div>
  </div>

  <!-- Page Controller Script (ES Module) -->
  <script type="module" src="../js/pages/chat.js"></script>
</body>
</html>
